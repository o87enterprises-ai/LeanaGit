<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" role="img" aria-label="Mama bear and cub walking">
  <!-- MAMA BEAR (larger, leading) -->
  <g>
    <!-- Body -->
    <ellipse cx="88" cy="60" rx="44" ry="27"/>
    <!-- Neck connector -->
    <ellipse cx="50" cy="51" rx="15" ry="11"/>
    <!-- Head -->
    <circle cx="34" cy="41" r="20"/>
    <!-- Ears -->
    <circle cx="22" cy="25" r="8"/>
    <circle cx="42" cy="23" r="8"/>
    <!-- Snout -->
    <ellipse cx="16" cy="47" rx="11" ry="8"/>
    <!-- Front legs -->
    <ellipse cx="58"  cy="85" rx="8"  ry="14" transform="rotate(-12 58 85)"/>
    <ellipse cx="74"  cy="88" rx="7"  ry="12" transform="rotate(6   74 88)"/>
    <!-- Back legs -->
    <ellipse cx="108" cy="86" rx="8"  ry="14" transform="rotate(8  108 86)"/>
    <ellipse cx="124" cy="84" rx="7"  ry="12" transform="rotate(-6 124 84)"/>
    <!-- Tail -->
    <circle cx="131" cy="50" r="7"/>
  </g>

  <!-- CUB (smaller, behind mama) -->
  <g>
    <!-- Body -->
    <ellipse cx="196" cy="69" rx="28" ry="18"/>
    <!-- Neck -->
    <ellipse cx="173" cy="61" rx="10" ry="8"/>
    <!-- Head -->
    <circle cx="162" cy="54" r="14"/>
    <!-- Ears -->
    <circle cx="152" cy="43" r="6"/>
    <circle cx="169" cy="41" r="6"/>
    <!-- Snout -->
    <ellipse cx="150" cy="59" rx="8" ry="6"/>
    <!-- Front legs -->
    <ellipse cx="178" cy="87" rx="6"  ry="10" transform="rotate(-10 178 87)"/>
    <ellipse cx="190" cy="89" rx="5"  ry="9"  transform="rotate(5  190 89)"/>
    <!-- Back legs -->
    <ellipse cx="208" cy="88" rx="6"  ry="10" transform="rotate(7  208 88)"/>
    <ellipse cx="220" cy="87" rx="5"  ry="9"  transform="rotate(-5 220 87)"/>
    <!-- Tail -->
    <circle cx="223" cy="60" r="5"/>
  </g>
</svg>
